# Exporter 商店标准清单（hutong-project-monitor 平台 Git 源消费）
#
# ⚠️ 本文件由 scripts/build.py 从 exporters/*/exporter.yaml 自动聚合生成，请勿手改。
#    修改请编辑对应类型的 exporters/<name>/exporter.yaml 后重新生成。
#
# 格式与校验权威定义见平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台拉取本文件（默认约定：仓库 main 分支根路径 exporter-types.yaml），或把商店"文件路径"
# 设为 exporters 走目录模式（Trees API 按字典序逐文件合并，与本聚合产物等价）。拉取后与内置
# 类型走完全相同的加载期校验，任一条目非法将整份拒绝并保留 last-good。
#
# 关键约束：
#   - sensitive: true 必须 kind: password，且落点（to）只允许 env 或 config，禁止进 args
#   - target_mode: connection（连接型多目标）必须搭配 config.mode=raw + config.secret_mount=true + 非空 template
#   - 探针型由 probe 声明；name 须为 ^[a-z][a-z0-9_]*$
#   - 同 key 条目整体覆盖平台内置定义（优先级 内置 < Git < 页面新增）
#
# 源清单最初由平台仓库 registry.Defaults() 忠实导出（2026-09-26，16 个市场类），
# 2026-09-27 起拆分维护于 exporters/ 目录，本文件为聚合产物。
types:
    - name: apache_exporter
      label: Apache（市场）
      preface: 前置：启用 mod_status，且地址须带 ?auto 后缀（缺后缀只有 up/CPU 指标）。
      configless: true
      requires_devices: false
      metrics_port: 9117
      health_path: /
      image: quay.io/lusitaniae/apache-exporter:v1.1.0
      args_template:
        - --scrape_uri={{.apache_scrape_uri}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: apache_scrape_uri
          label: server-status 地址
          kind: text
          default: http://localhost/server-status?auto
          to: arg
          hint: 必须带 ?auto 后缀

    - name: blackbox_exporter
      label: Blackbox 探针（市场）
      preface: 探针型：在「探测目标」中登记目标列表（实例级在线增删，只更新抓取配置，零 Pod 滚动）。探测自身 /metrics 抓取始终保留。
      configless: false
      requires_devices: false
      metrics_port: 9115
      health_path: /
      image: quay.io/prometheus/blackbox-exporter:v0.25.0
      args:
        - --config.file=/etc/blackbox_exporter/config.yml
      listen_default: ""
      device_port_default: 0
      config:
        mode: raw
        template: |
            modules:
              http_2xx:
                prober: http
                timeout: 5s
                http:
                  preferred_ip_protocol: ip4
              icmp:
                prober: icmp
                timeout: 5s
                icmp:
                  preferred_ip_protocol: ip4
              tcp_connect:
                prober: tcp
                timeout: 5s
        mount_path: /etc/blackbox_exporter/config.yml
      probe:
        path: /probe
        modules:
            - http_2xx
            - icmp
            - tcp_connect
        default_module: http_2xx

    - name: clickhouse_exporter
      label: ClickHouse（市场）
      preface: 上游仓库已迁移至 ClickHouse/clickhouse_exporter（f1yegor 原仓库已删除）；镜像仓库仅 latest 一个 tag（2021 年构建），地址经 -scrape_uri 参数注入（CLICKHOUSE_URL 环境变量不被读取），凭据走 CLICKHOUSE_USER/CLICKHOUSE_PASSWORD 环境变量。新版 ClickHouse 建议优先使用其内建 /metrics 端点。
      configless: true
      requires_devices: false
      metrics_port: 9116
      health_path: /
      image: f1yegor/clickhouse-exporter:latest
      args_template:
        - -scrape_uri={{.clickhouse_url}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: clickhouse_url
          label: ClickHouse 地址
          kind: text
          default: http://localhost:8123/
          to: arg
        - key: clickhouse_user
          label: 账号
          kind: text
          to: env
          env: CLICKHOUSE_USER
        - key: clickhouse_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: CLICKHOUSE_PASSWORD

    - name: elasticsearch_exporter
      label: Elasticsearch（市场）
      preface: 凭据必须走环境变量，不要内联进 URI（URL 编码坑）。
      configless: true
      requires_devices: false
      metrics_port: 9114
      health_path: /
      image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
      args_template:
        - --es.uri={{.es_uri}}
        - '{{ if eq .es_ssl_skip_verify "true" }}--es.ssl-skip-verify{{ end }}'
      listen_default: ""
      device_port_default: 0
      fields:
        - key: es_uri
          label: 集群地址
          kind: text
          default: http://elasticsearch:9200
          to: arg
          hint: host:port 形态
        - key: es_username
          label: 账号
          kind: text
          to: env
          env: ES_USERNAME
        - key: es_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: ES_PASSWORD
        - key: es_api_key
          label: API Key（可选）
          kind: password
          sensitive: true
          to: env
          env: ES_API_KEY
          advanced: true
          hint: 提供后以 API Key 认证（v1.9.0 无对应 flag，仅环境变量生效；勿与账号密码同时填写）
        - key: es_ssl_skip_verify
          label: 跳过 TLS 校验
          kind: select
          default: "false"
          options:
            - "false"
            - "true"
          to: arg
          advanced: true

    - name: haproxy_exporter
      label: HAProxy 1.x（市场 · 已归档）
      preface: 前置：HAProxy stats endpoint（HTTP 或 unix socket）。官方已归档（2023-03）：纳入为照顾 1.x 存量；HAProxy ≥2.0 建议编译 USE_PROMEX 原生 /metrics（后续登记）。
      configless: true
      requires_devices: false
      metrics_port: 9101
      health_path: /
      image: quay.io/prometheus/haproxy-exporter:v0.15.0
      args_template:
        - --haproxy.scrape-uri={{.haproxy_scrape_uri}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: haproxy_scrape_uri
          label: stats 地址
          kind: text
          default: http://localhost/haproxy?;csv
          to: arg
          hint: 必须带 ;csv 后缀（路径形态对齐官方 README 示例；按实际 stats 前端填写）

    - name: kafka_exporter
      label: Kafka（市场）
      configless: true
      requires_devices: false
      metrics_port: 9308
      health_path: /
      image: danielqsj/kafka-exporter:v1.9.0
      args_template:
        - --kafka.server={{.kafka_servers}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: kafka_servers
          label: Kafka 地址
          kind: text
          default: localhost:9092
          to: arg
          hint: 单条 --kafka.server 注入（KAFKA_SERVERS 环境变量不被该镜像读取）；多 broker 场景需扩展本类型 args_template（--kafka.server 可重复传）

    - name: memcached_exporter
      label: Memcached（市场）
      configless: true
      requires_devices: false
      metrics_port: 9150
      health_path: /
      image: quay.io/prometheus/memcached-exporter:v0.15.1
      args_template:
        - --memcached.address={{.memcached_address}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: memcached_address
          label: Memcached 地址
          kind: text
          default: localhost:11211
          to: arg

    - name: mongodb_exporter
      label: MongoDB（市场）
      preface: 凭据走环境变量（官方明确命令行 flag 会经 ps 泄漏）；建议为监控账号只授予 clusterMonitor 角色。
      configless: true
      requires_devices: false
      metrics_port: 9216
      health_path: /
      image: percona/mongodb_exporter:0.43.1
      listen_default: ""
      device_port_default: 0
      fields:
        - key: mongodb_uri
          label: MongoDB 地址
          kind: text
          to: env
          env: MONGODB_URI
          hint: mongodb://host:27017（凭据可用下方账号密码单独提供）
        - key: mongodb_user
          label: 账号
          kind: text
          to: env
          env: MONGODB_USER
        - key: mongodb_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: MONGODB_PASSWORD

    - name: mssql_exporter
      label: SQL Server（市场）
      preface: 数据库侧需授权：GRANT VIEW ANY DEFINITION、GRANT VIEW SERVER STATE。
      configless: true
      requires_devices: false
      metrics_port: 4000
      health_path: /
      image: awaragi/prometheus-mssql-exporter:v1.3.0
      listen_default: ""
      device_port_default: 0
      fields:
        - key: mssql_host
          label: SQL Server 主机
          kind: text
          required: true
          to: env
          env: SERVER
        - key: mssql_port
          label: 端口
          kind: number
          default: "1433"
          to: env
          env: PORT
        - key: mssql_user
          label: 账号
          kind: text
          to: env
          env: USERNAME
        - key: mssql_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: PASSWORD

    - name: mysql_exporter
      label: MySQL（市场 · 多目标）
      preface: 多目标连接型：账号/密码为本实例全部目标共享；监控目标（host:port）在 Targets 页统一管理，增删目标只更新抓取配置，修改密码会触发 Pod 滚动更新。上游 mysqld-exporter 已停止维护（多目标能力需 v0.15+）。数据库侧需 DBA 预先建号授权：GRANT PROCESS, REPLICATION CLIENT, SELECT ON *.* TO 'exporter'@'%'; 并设 MAX_USER_CONNECTIONS 3。平台只管 exporter，不管被监控的 MySQL 本身。注意：exporter 自身 /metrics 端点未绑定目标，其 mysql_up=0 为预期（各目标的 mysql_up 见 Targets 页 instance 维度）。
      configless: false
      requires_devices: false
      metrics_port: 9104
      health_path: /
      image: quay.io/prometheus/mysqld-exporter:v0.15.1
      args:
        - --config.my-cnf=/etc/mysql_exporter/.my.cnf
      listen_default: ""
      device_port_default: 0
      config:
        mode: raw
        template: |
            [client]
            user = {{ .Fields.mysql_user }}
            password = {{ .mysql_password }}
        mount_path: /etc/mysql_exporter/.my.cnf
        secret_mount: true
      target_mode: connection
      fields:
        - key: mysql_user
          label: 数据库账号
          kind: text
          default: exporter
          to: var
          hint: 本实例全部监控目标共享的连接账号
        - key: mysql_password
          label: 数据库密码
          kind: password
          required: true
          sensitive: true
          to: config
          hint: 只写不回显 · 加密存储 · 物化为 Secret（修改将触发滚动更新）

    - name: nginx_exporter
      label: NGINX（市场）
      preface: 前置：被监控端开启 stub_status（开源版）或 /api（NGINX Plus）。
      configless: true
      requires_devices: false
      metrics_port: 9113
      health_path: /
      image: nginx/nginx-prometheus-exporter:1.4.2
      args_template:
        - --nginx.scrape-uri={{.nginx_scrape_uri}}
        - '{{ if eq .nginx_plus "true" }}--nginx.plus{{ end }}'
      listen_default: ""
      device_port_default: 0
      fields:
        - key: nginx_scrape_uri
          label: stub_status 地址
          kind: text
          default: http://127.0.0.1:8080/stub_status
          to: arg
        - key: nginx_plus
          label: NGINX Plus
          kind: select
          default: "false"
          options:
            - "false"
            - "true"
          to: arg
          advanced: true

    - name: node_exporter
      label: Node Exporter（主机 · DaemonSet）
      configless: true
      requires_devices: false
      metrics_port: 9100
      health_path: /
      image: quay.io/prometheus/node-exporter:v1.9.1
      args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
      host_mounts:
        - host_path: /proc
          mount_path: /host/proc
        - host_path: /sys
          mount_path: /host/sys
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      listen_default: ""
      device_port_default: 0
      workload: daemonset
      resources:
        requests:
            cpu: 20m
            memory: 32Mi
        limits:
            cpu: 200m
            memory: 128Mi
      scrape:
        interval: 15s

    - name: postgresql_exporter
      label: PostgreSQL（市场）
      preface: 数据库侧需建号并授予监控只读（pg_monitor 角色）。
      configless: true
      requires_devices: false
      metrics_port: 9187
      health_path: /
      image: prometheuscommunity/postgres-exporter:v0.15.0
      listen_default: ""
      device_port_default: 0
      fields:
        - key: pg_datasource
          label: 数据源 DSN
          kind: password
          required: true
          sensitive: true
          to: env
          env: DATA_SOURCE_NAME
          hint: postgresql://user:password@host:5432/database?sslmode=disable

    - name: rabbitmq_exporter
      label: RabbitMQ 3.x（市场 · 已归档）
      preface: 前置：启用 management 插件，并创建带 monitoring 标签的用户。项目已归档，仅支持 RabbitMQ 3.x；4+ 请用原生 rabbitmq_prometheus 插件（后续阶段登记）。
      configless: true
      requires_devices: false
      metrics_port: 9419
      health_path: /
      image: kbudde/rabbitmq-exporter:1.0.0
      listen_default: ""
      device_port_default: 0
      fields:
        - key: rabbit_url
          label: 管理接口地址
          kind: text
          default: http://127.0.0.1:15672
          to: env
          env: RABBIT_URL
        - key: rabbit_user
          label: 管理用户
          kind: text
          default: guest
          to: env
          env: RABBIT_USER
        - key: rabbit_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: RABBIT_PASSWORD

    - name: redis_exporter
      label: Redis（市场）
      configless: true
      requires_devices: false
      metrics_port: 9121
      health_path: /
      image: oliver006/redis_exporter:v1.66.0
      listen_default: ""
      device_port_default: 0
      fields:
        - key: redis_addr
          label: Redis 地址
          kind: text
          default: redis://localhost:6379
          to: env
          env: REDIS_ADDR
        - key: redis_password
          label: Redis 密码
          kind: password
          sensitive: true
          to: env
          env: REDIS_PASSWORD

    - name: snmp_exporter
      label: SNMP 探针（市场）
      preface: 探针型：目标列表实例级在线增删（零 Pod 滚动）。snmp.yml 含团体字等凭据，整文件以 Secret 挂载（ConfigMap 无凭据）；模块段为 generator 产物示例，深度定制经 exporter-types.yaml 覆盖。
      configless: false
      requires_devices: false
      metrics_port: 9116
      health_path: /
      image: quay.io/prometheus/snmp-exporter:v0.26.0
      args:
        - --config.file=/etc/snmp_exporter/snmp.yml
      listen_default: ""
      device_port_default: 0
      config:
        mode: raw
        template: |
            modules:
              if_mib:
                walk:
                  - 1.3.6.1.2.1.2.2.1.1
                  - 1.3.6.1.2.1.2.2.1.2
                  - 1.3.6.1.2.1.2.2.1.3
                  - 1.3.6.1.2.1.2.2.1.5
                  - 1.3.6.1.2.1.2.2.1.6
                  - 1.3.6.1.2.1.2.2.1.7
                  - 1.3.6.1.2.1.2.2.1.8
                  - 1.3.6.1.2.1.2.2.1.10
                  - 1.3.6.1.2.1.2.2.1.14
                  - 1.3.6.1.2.1.2.2.1.16
                metrics:
                  - name: ifIndex
                    oid: 1.3.6.1.2.1.2.2.1.1
                    type: gauge
                  - name: ifDescr
                    oid: 1.3.6.1.2.1.2.2.1.2
                    type: DisplayString
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifType
                    oid: 1.3.6.1.2.1.2.2.1.3
                    type: gauge
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                    lookups:
                      - labels:
                          - ifIndex
                          - ifDescr
                        labelname: ifDescr
                        oid: 1.3.6.1.2.1.2.2.1.2
                  - name: ifSpeed
                    oid: 1.3.6.1.2.1.2.2.1.5
                    type: gauge
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifPhysAddress
                    oid: 1.3.6.1.2.1.2.2.1.6
                    type: PhysAddress48
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifAdminStatus
                    oid: 1.3.6.1.2.1.2.2.1.7
                    type: EnumAsStateSet
                    enum_values:
                      1: up
                      2: down
                      3: testing
                      4: unknown
                      5: dormant
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifOperStatus
                    oid: 1.3.6.1.2.1.2.2.1.8
                    type: EnumAsStateSet
                    enum_values:
                      1: up
                      2: down
                      3: testing
                      4: unknown
                      5: dormant
                      6: notPresent
                      7: lowerLayerDown
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifInOctets
                    oid: 1.3.6.1.2.1.2.2.1.10
                    type: counter
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifInErrors
                    oid: 1.3.6.1.2.1.2.2.1.14
                    type: counter
                    indexes:
                      - labelname: ifIndex
                        type: gauge
                  - name: ifOutOctets
                    oid: 1.3.6.1.2.1.2.2.1.16
                    type: counter
                    indexes:
                      - labelname: ifIndex
                        type: gauge
              sysuptime:
                get:
                  - 1.3.6.1.2.1.1.3.0
                metrics:
                  - name: sysUpTime
                    oid: 1.3.6.1.2.1.1.3
                    type: gauge
                    help: The time (in hundredths of a second) since the network management portion of the system was last re-initialized.
            auths:
              public_v2:
                community: {{ .snmp_community }}
                version: 2
        mount_path: /etc/snmp_exporter/snmp.yml
        secret_mount: true
      probe:
        path: /snmp
        modules:
            - if_mib
            - sysuptime
        default_module: if_mib
        auth: public_v2
      fields:
        - key: snmp_community
          label: SNMP 团体字（community）
          kind: password
          required: true
          sensitive: true
          to: config
          hint: 渲染进 snmp.yml auth 段，整文件以 Secret 挂载，任何 ConfigMap / 预览不出现明文
