# elasticsearch_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台经目录模式拉取本目录（Trees API 字典序逐文件合并），勿在此目录放置其他 yaml/yml 文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: elasticsearch_exporter
      label: Elasticsearch（市场）
      preface: 凭据必须走环境变量，不要内联进 URI（URL 编码坑）。
      configless: true
      requires_devices: false
      metrics_port: 9114
      health_path: /
      image: quay.io/prometheuscommunity/elasticsearch-exporter:v1.9.0
      args_template:
        - --es.uri={{.es_uri}}
        - '{{ if eq .es_ssl_skip_verify "true" }}--es.ssl-skip-verify{{ end }}'
      listen_default: ""
      device_port_default: 0
      fields:
        - key: es_uri
          label: 集群地址
          kind: text
          default: http://elasticsearch:9200
          to: arg
          hint: host:port 形态
        - key: es_username
          label: 账号
          kind: text
          to: env
          env: ES_USERNAME
        - key: es_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: ES_PASSWORD
        - key: es_api_key
          label: API Key（可选）
          kind: password
          sensitive: true
          to: env
          env: ES_API_KEY
          advanced: true
          hint: 提供后以 API Key 认证（v1.9.0 无对应 flag，仅环境变量生效；勿与账号密码同时填写）
        - key: es_ssl_skip_verify
          label: 跳过 TLS 校验
          kind: select
          default: "false"
          options:
            - "false"
            - "true"
          to: arg
          advanced: true
