# nginx_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台经目录模式拉取本目录（Trees API 字典序逐文件合并），勿在此目录放置其他 yaml/yml 文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: nginx_exporter
      label: NGINX（市场）
      preface: 前置：被监控端开启 stub_status（开源版）或 /api（NGINX Plus）。
      configless: true
      requires_devices: false
      metrics_port: 9113
      health_path: /
      image: nginx/nginx-prometheus-exporter:1.4.2
      args_template:
        - --nginx.scrape-uri={{.nginx_scrape_uri}}
        - '{{ if eq .nginx_plus "true" }}--nginx.plus{{ end }}'
      listen_default: ""
      device_port_default: 0
      fields:
        - key: nginx_scrape_uri
          label: stub_status 地址
          kind: text
          default: http://127.0.0.1:8080/stub_status
          to: arg
        - key: nginx_plus
          label: NGINX Plus
          kind: select
          default: "false"
          options:
            - "false"
            - "true"
          to: arg
          advanced: true
