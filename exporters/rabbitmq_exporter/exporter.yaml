# rabbitmq_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 根 exporter-types.yaml 由 scripts/build.py 自动聚合生成，请勿手改根文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: rabbitmq_exporter
      label: RabbitMQ 3.x（市场 · 已归档）
      preface: 前置：启用 management 插件，并创建带 monitoring 标签的用户。项目已归档，仅支持 RabbitMQ 3.x；4+ 请用原生 rabbitmq_prometheus 插件（后续阶段登记）。
      configless: true
      requires_devices: false
      metrics_port: 9419
      health_path: /
      image: kbudde/rabbitmq-exporter:1.0.0
      listen_default: ""
      device_port_default: 0
      fields:
        - key: rabbit_url
          label: 管理接口地址
          kind: text
          default: http://127.0.0.1:15672
          to: env
          env: RABBIT_URL
        - key: rabbit_user
          label: 管理用户
          kind: text
          default: guest
          to: env
          env: RABBIT_USER
        - key: rabbit_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: RABBIT_PASSWORD
