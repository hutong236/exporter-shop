# haproxy_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 根 exporter-types.yaml 由 scripts/build.py 自动聚合生成，请勿手改根文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: haproxy_exporter
      label: HAProxy 1.x（市场 · 已归档）
      preface: 前置：HAProxy stats endpoint（HTTP 或 unix socket）。官方已归档（2023-03）：纳入为照顾 1.x 存量；HAProxy ≥2.0 建议编译 USE_PROMEX 原生 /metrics（后续登记）。
      configless: true
      requires_devices: false
      metrics_port: 9101
      health_path: /
      image: quay.io/prometheus/haproxy-exporter:v0.15.0
      args_template:
        - --haproxy.scrape-uri={{.haproxy_scrape_uri}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: haproxy_scrape_uri
          label: stats 地址
          kind: text
          default: http://localhost/haproxy?;csv
          to: arg
          hint: 必须带 ;csv 后缀（路径形态对齐官方 README 示例；按实际 stats 前端填写）
