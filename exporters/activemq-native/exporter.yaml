# activemq-native — Exporter 商店清单（单类型源文件）
#
# 直连原生端点型（外部已部署登记观测）：ActiveMQ broker 侧由运维预先挂载
# jmx_exporter javaagent（prometheus/jmx_exporter，Artemis 文档同款 8778 惯例端口）
# 暴露 /metrics——平台零工作负载，不代为部署 agent，本条目只登记抓取目标，
# vmagent 直抓目标端点，实例进台账并与部署型同权观测。
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台经目录模式拉取本目录（Trees API 字典序逐文件合并），勿在此目录放置其他 yaml/yml 文件。
#
# endpoint 机制（平台 REQ-181，加载期归一，声明与否都会被覆盖）：
#   - workload 归一为 none（免部署锚定，operator 以此为单一权威信号跳过全部工作负载物化）
#   - health_path 平台统一归一为 /metrics（逐目标探测路径权威在 target_contract.path）
#   - 物化产物仅单个 VMStaticScrape（无 Deployment/DaemonSet/ConfigMap/Secret）
#   - 禁止声明：workload / image / fields / config / requires_devices / probe /
#     target_health_metric（免部署、无认证直抓；认证字段属平台后续版本）
#
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: activemq-native
      label: 外部 ActiveMQ（登记观测）
      preface: 直连原生端点型：需在 ActiveMQ broker 侧预先挂载 jmx_exporter javaagent（平台外部前置，平台不代为部署）暴露 /metrics 后登记本端点；平台免部署采集器，vmagent 直抓并纳入台账与健康观测。指标端口按 javaagent 启动参数选定，本条目默认登记 Artemis 文档惯例 8778，实例级可改。
      target_mode: endpoint
      metrics_port: 8778
      target_contract:
        mode: endpoint
        path: /metrics
        scheme: http
