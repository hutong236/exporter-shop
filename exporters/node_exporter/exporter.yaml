# node_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台经目录模式拉取本目录（Trees API 字典序逐文件合并），勿在此目录放置其他 yaml/yml 文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: node_exporter
      label: Node Exporter（主机 · DaemonSet）
      configless: true
      requires_devices: false
      metrics_port: 9100
      health_path: /
      image: quay.io/prometheus/node-exporter:v1.9.1
      args:
        - --path.procfs=/host/proc
        - --path.sysfs=/host/sys
      host_mounts:
        - host_path: /proc
          mount_path: /host/proc
        - host_path: /sys
          mount_path: /host/sys
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      listen_default: ""
      device_port_default: 0
      workload: daemonset
      resources:
        requests:
            cpu: 20m
            memory: 32Mi
        limits:
            cpu: 200m
            memory: 128Mi
      scrape:
        interval: 15s
