# memcached_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 平台经目录模式拉取本目录（Trees API 字典序逐文件合并），勿在此目录放置其他 yaml/yml 文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: memcached_exporter
      label: Memcached（市场）
      configless: true
      requires_devices: false
      metrics_port: 9150
      health_path: /
      image: quay.io/prometheus/memcached-exporter:v0.15.1
      args_template:
        - --memcached.address={{.memcached_address}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: memcached_address
          label: Memcached 地址
          kind: text
          default: localhost:11211
          to: arg
