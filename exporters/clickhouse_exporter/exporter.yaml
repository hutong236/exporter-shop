# clickhouse_exporter — Exporter 商店清单（单类型源文件）
#
# 格式与校验权威：平台仓库 backend/internal/console/registry/registry.go（TypeDef schema）。
# 根 exporter-types.yaml 由 scripts/build.py 自动聚合生成，请勿手改根文件。
# 上游实际配置核验记录：docs/upstream-verification.md。
types:
    - name: clickhouse_exporter
      label: ClickHouse（市场）
      preface: 上游仓库已迁移至 ClickHouse/clickhouse_exporter（f1yegor 原仓库已删除）；镜像仓库仅 latest 一个 tag（2021 年构建），地址经 -scrape_uri 参数注入（CLICKHOUSE_URL 环境变量不被读取），凭据走 CLICKHOUSE_USER/CLICKHOUSE_PASSWORD 环境变量。新版 ClickHouse 建议优先使用其内建 /metrics 端点。
      configless: true
      requires_devices: false
      metrics_port: 9116
      health_path: /
      image: f1yegor/clickhouse-exporter:latest
      args_template:
        - -scrape_uri={{.clickhouse_url}}
      listen_default: ""
      device_port_default: 0
      fields:
        - key: clickhouse_url
          label: ClickHouse 地址
          kind: text
          default: http://localhost:8123/
          to: arg
        - key: clickhouse_user
          label: 账号
          kind: text
          to: env
          env: CLICKHOUSE_USER
        - key: clickhouse_password
          label: 密码
          kind: password
          sensitive: true
          to: env
          env: CLICKHOUSE_PASSWORD
