name: manifest

# Exporter 商店清单校验：平台语义为"任一条目非法即整份拒绝"，
# 在 CI 提前拦截同类错误，并防止根聚合文件与 exporters/ 源目录漂移。

on:
  push:
    branches: [main]
    paths:
      - "exporters/**"
      - "exporter-types.yaml"
      - "scripts/**"
      - ".github/workflows/manifest.yml"
  pull_request:
    paths:
      - "exporters/**"
      - "exporter-types.yaml"
      - "scripts/**"
      - ".github/workflows/manifest.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 校验清单 + 聚合防漂移
        run: python3 scripts/validate.py
